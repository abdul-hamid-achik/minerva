version: 1
name: minerva_help
intent: |
    operators can run minerva -h and discover the public command surface
    for sessions, proposals, skills, and harness sync.
target:
    cmd: ["./bin/minerva", "-h"]
    cwd: "."
terminal:
    cols: 120
    rows: 40
    profile: xterm-256color
preconditions:
    commands:
        - run: "go build -o ./bin/minerva ./cmd/minerva"
          cwd: "."
          timeoutMs: 60000
steps:
    - wait:
        screen:
            contains: "Available Commands:"
        timeoutMs: 3000
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: usage_visible
      description: help shows available commands
      verify:
        screen:
            contains: "Available Commands:"
    - id: core_commands_documented
      description: help lists skill, harness, sessions, analyze, propose, learn, mcp
      verify:
        command:
            run: |
                output="$(./bin/minerva -h 2>&1)"
                printf '%s\n' "$output" | grep -qE -- 'skill'
                printf '%s\n' "$output" | grep -qE -- 'harness'
                printf '%s\n' "$output" | grep -qE -- 'sessions'
                printf '%s\n' "$output" | grep -qE -- 'analyze'
                printf '%s\n' "$output" | grep -qE -- 'propose'
                printf '%s\n' "$output" | grep -qE -- 'learn'
                printf '%s\n' "$output" | grep -qE -- 'mcp'
    - id: exits_zero
      description: help exits successfully
      verify:
        process:
            exitCode: 0
contractHash: sha256:cfc677f384b4cf271f77e6aeae3e5294da9c55a694fe650ea57532415cfcefc0
